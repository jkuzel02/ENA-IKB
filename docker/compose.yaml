services:
  suricata:
    image: jasonish/suricata:8.0
    container_name: suricata
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ./config:/etc/suricata:rw
      - ./logs:/var/log/suricata:rw
      - ./rules:/var/lib/suricata/rules:rw
    command: >
      -i enp3s0
      -c /etc/suricata/suricata.yaml

  evebox:
    image: jasonish/evebox:latest
    container_name: evebox
    restart: unless-stopped
    ports:
      - "5636:5636"
    volumes:
      - ./logs:/var/log/suricata:ro
      - evebox-data:/var/lib/evebox
    command:
      - evebox
      - server
      - --datastore
      - sqlite
      - --data-directory
      - /var/lib/evebox
      - --host
      - 0.0.0.0
      - --input
      - /var/log/suricata/eve.json

volumes:
  evebox-data:
